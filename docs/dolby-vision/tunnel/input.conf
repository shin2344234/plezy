# Pad bindings for mpv in the Dolby Vision tunnel. Plezy reads the pad itself
# through evdev while the tunnel has the screen, and it draws its controls into
# the picture, so mpv acting on the same presses would run each one twice.
# The View button is left as a way out in case Plezy loses the pad. Plezy
# doesn't use it, and plezy-window-exit reaches Plezy over the IPC link, which
# leaves the player as it does for the window.
GAMEPAD_BACK script-message plezy-window-exit
